<!DOCTYPE html>
<html lang="cs" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pravoúhlé Promítání CAD - Výukový Software</title>
    <meta name="description" content="Interaktivní webová aplikace v Reactu a Three.js pro výuku a procvičování pravoúhlého promítání (nárys, půdorys, bokorys) z CAD modelů Fusion 360." />
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              cad: {
                blue: '#0369a1',
                cyan: '#06b6d4',
                dark: '#0f172a',
                paper: '#f8fafc',
              }
            }
          }
        }
      }
    </script>

    <!-- Import Map for Modern ES Modules -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0?dev",
          "react-dom": "https://esm.sh/react-dom@18.2.0?dev",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?dev",
          "three": "https://esm.sh/three@0.160.0",
          "three/examples/jsm/controls/OrbitControls.js": "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js",
          "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <!-- Babel Standalone for in-browser JSX/TypeScript execution -->
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans">
    <div id="root"></div>
    <script type="text/babel" data-type="module" src="./src/main.tsx"></script>
  </body>
</html>
