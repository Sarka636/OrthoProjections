      tailwind.config = {
        darkMode: 'class',

    <!-- React 18 & ReactDOM -->

    <style>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // --- SAMPLE MODELS METADATA ---
      const SAMPLE_MODELS = [
        {
          id: 'sample-l-shape',
          name: '1. L-Profil (Stupňovitý blok)',
          difficulty: 'lehká',
          description: 'Základní stupňovité těleso ve tvaru L. Ideální pro první seznámení s nárysem, půdorysem a bokorysem.',
          fileType: 'procedural',
          proceduralId: 'l_shape',
          isSample: true,
        },
        {
          id: 'sample-wedge-groove',
          name: '2. Klínový blok s drážkou',
          difficulty: 'lehká',
          description: 'Těleso se šikmou rozměrovou plochou a podélným vybráním. Šikmá plocha se zobrazuje v půdorysu i bokorysu.',
          fileType: 'procedural',
          proceduralId: 'wedge_groove',
          isSample: true,
        },
        {
          id: 'sample-u-block-hole',
          name: '3. U-Profil s válcovým otvorem',
          difficulty: 'střední',
          description: 'Strojní U-blok s přesným kruhovým otvorem. Vykresluje v nárysu a bokorysu tenké čárkované skryté hrany.',
          fileType: 'procedural',
          proceduralId: 'u_block_hole',
          isSample: true,
        },
        {
          id: 'sample-stepped-pyramid',
          name: '4. Stupňovité těleso se zkosením',
          difficulty: 'střední',
          description: 'Víceúrovňový hranol s čelním zkosením a postranními výřezy. Prověřuje správnost čtení viditelných obrysů.',
          fileType: 'procedural',
          proceduralId: 'stepped_pyramid',
          isSample: true,
        },
        {
          id: 'sample-fusion-tslot',
          name: '5. CAD T-drážka z Fusion 360',
          difficulty: 'těžká',
          description: 'Složitý CAD model vyrobený ve Fusion 360 s T-drážkou, zkosenými hranami a vnitřním vybráním.',
          fileType: 'procedural',
          proceduralId: 'fusion_tslot_complex',
          isSample: true,
        },
      ];

      // --- INDEXED DB ENGINE ---
      const DB_NAME = 'OrthographicCAD_Standalone_DB';
      const STORE_NAME = 'models';

      function openDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, 2);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function getAllModelsFromDB() {
        try {
          const db = await openDB();
          return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const req = tx.objectStore(STORE_NAME).getAll();
            req.onsuccess = async () => {
              let res = req.result || [];
              if (res.length === 0) {
                res = SAMPLE_MODELS;
                await seedDB(res);
              }
              resolve(res);
            };
          });
        } catch {
          return SAMPLE_MODELS;
        }
      }

      async function seedDB(models) {
        try {
          const db = await openDB();
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          models.forEach(m => store.put(m));
        } catch {}
      }

      async function saveModelToDB(model) {
        const db = await openDB();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).put(model);
          tx.oncomplete = () => resolve();
        });
      }

      async function deleteModelFromDB(id) {
        const db = await openDB();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).delete(id);
          tx.oncomplete = () => resolve();
        });
      }

      async function resetDBToSamples() {
        const db = await openDB();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          store.clear().onsuccess = async () => {
            await seedDB(SAMPLE_MODELS);
            resolve(SAMPLE_MODELS);
          };
        });
      }

      // --- GEOMETRY UTILITIES & OBJ PARSER ---
      function normalizeGeometry(geometry) {
        try {
          geometry.computeBoundingBox();
          geometry.center();
          geometry.computeVertexNormals();

          if (geometry.boundingBox) {
            const size = new THREE.Vector3();
            geometry.boundingBox.getSize(size);
            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim > 0 && !isNaN(maxDim) && isFinite(maxDim)) {
              const scale = 2.4 / maxDim;
              geometry.scale(scale, scale, scale);
            }
          }
        } catch (e) {}
        return geometry;
      }

      function createProceduralGeometry(id) {
        switch (id) {
          case 'l_shape': {
            const shape = new THREE.Shape();
            shape.moveTo(-1, -1); shape.lineTo(1, -1); shape.lineTo(1, 0); shape.lineTo(0, 0); shape.lineTo(0, 1); shape.lineTo(-1, 1); shape.closePath();
            return normalizeGeometry(new THREE.ExtrudeGeometry(shape, { depth: 1.5, bevelEnabled: false }));
          }
          case 'wedge_groove': {
            const shape = new THREE.Shape();
            shape.moveTo(-1.2, -0.8); shape.lineTo(1.2, -0.8); shape.lineTo(1.2, 0.2); shape.lineTo(-1.2, 1.0); shape.closePath();
            return normalizeGeometry(new THREE.ExtrudeGeometry(shape, { depth: 1.6, bevelEnabled: false }));
          }
          case 'u_block_hole': {
            const shape = new THREE.Shape();
            shape.moveTo(-1.2, -1.0); shape.lineTo(1.2, -1.0); shape.lineTo(1.2, 1.0); shape.lineTo(0.5, 1.0); shape.lineTo(0.5, -0.2); shape.lineTo(-0.5, -0.2); shape.lineTo(-0.5, 1.0); shape.lineTo(-1.2, 1.0); shape.closePath();
            const hole = new THREE.Path(); hole.absarc(-0.85, 0.3, 0.25, 0, Math.PI * 2, true); shape.holes.push(hole);
            return normalizeGeometry(new THREE.ExtrudeGeometry(shape, { depth: 1.4, bevelEnabled: false }));
          }
          case 'stepped_pyramid': {
            const shape = new THREE.Shape();
            shape.moveTo(-1.2, -1.0); shape.lineTo(1.2, -1.0); shape.lineTo(1.2, -0.3); shape.lineTo(0.7, -0.3); shape.lineTo(0.7, 0.4); shape.lineTo(0.2, 1.0); shape.lineTo(-0.7, 1.0); shape.lineTo(-0.7, -0.3); shape.lineTo(-1.2, -0.3); shape.closePath();
            return normalizeGeometry(new THREE.ExtrudeGeometry(shape, { depth: 1.5, bevelEnabled: false }));
          }
          case 'fusion_tslot_complex': {
            const shape = new THREE.Shape();
            shape.moveTo(-1.4, -1.0); shape.lineTo(1.4, -1.0); shape.lineTo(1.4, 0.4); shape.lineTo(1.0, 1.0); shape.lineTo(0.3, 1.0); shape.lineTo(0.3, 0.5); shape.lineTo(0.6, 0.5); shape.lineTo(0.6, 0.1); shape.lineTo(-0.6, 0.1); shape.lineTo(-0.6, 0.5); shape.lineTo(-0.3, 0.5); shape.lineTo(-0.3, 1.0); shape.lineTo(-1.4, 1.0); shape.closePath();
            return normalizeGeometry(new THREE.ExtrudeGeometry(shape, { depth: 1.8, bevelEnabled: false }));
          }
          default:
            return normalizeGeometry(new THREE.BoxGeometry(2, 1.5, 1));
        }
      }

      function parseOBJString(text) {
        const positions = [];
        const vertices = [];
        const lines = text.split('\n');
        for (let line of lines) {
          line = line.trim();
          if (line.startsWith('v ')) {
            positions.push(line.split(/\s+/).slice(1).map(Number));
          } else if (line.startsWith('f ')) {
            const parts = line.split(/\s+/).slice(1).map(p => parseInt(p.split('/')[0], 10) - 1);
            for (let i = 1; i < parts.length - 1; i++) {
              if (positions[parts[0]] && positions[parts[i]] && positions[parts[i+1]]) {
                vertices.push(...positions[parts[0]], ...positions[parts[i]], ...positions[parts[i+1]]);
              }
            }
          }
        }
        const geom = new THREE.BufferGeometry();
        if (vertices.length > 0) {
          geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        } else {
          return normalizeGeometry(new THREE.BoxGeometry(2, 1.5, 1));
        }
        return normalizeGeometry(geom);
      }

      function loadGeometryForModel(model) {
        try {
          if (model.fileType === 'procedural' && model.proceduralId) {
            return createProceduralGeometry(model.proceduralId);
          }
          if (model.fileData && typeof model.fileData === 'string') {
            return parseOBJString(model.fileData);
          }
        } catch (e) {}
        return createProceduralGeometry('l_shape');
      }

      function createTechnicalRepresentation(geometry) {
        const group = new THREE.Group();
        const solidMaterial = new THREE.MeshPhongMaterial({
          color: 0x38bdf8,
          emissive: 0x0369a1,
          emissiveIntensity: 0.15,
          shininess: 40,
          transparent: true,
          opacity: 0.85,
          side: THREE.DoubleSide,
        });
        group.add(new THREE.Mesh(geometry, solidMaterial));

        const edgesGeom = new THREE.EdgesGeometry(geometry, 25);
        const edgesMat = new THREE.LineBasicMaterial({ color: 0x0f172a, linewidth: 2 });
        group.add(new THREE.LineSegments(edgesGeom, edgesMat));

        const hiddenMat = new THREE.LineDashedMaterial({ color: 0x64748b, linewidth: 1, dashSize: 0.1, gapSize: 0.06 });
        const hiddenWire = new THREE.LineSegments(new THREE.WireframeGeometry(geometry), hiddenMat);
        hiddenWire.computeLineDistances();
        group.add(hiddenWire);

        return group;
      }

      // --- COMPONENTS ---

      // 1. Axonometry Viewer (Kompaktní h-[230px])
      function AxonometryViewer({ model }) {
        const mountRef = useRef(null);
        const [isRotating, setIsRotating] = useState(false);
        const controlsRef = useRef(null);

        useEffect(() => {
          const container = mountRef.current;
          if (!container) return;
          const w = container.clientWidth;
          const h = container.clientHeight || 220;

          const scene = new THREE.Scene();
          scene.background = new THREE.Color(0x0f172a);

          const grid = new THREE.GridHelper(6, 12, 0x334155, 0x1e293b);
          grid.position.y = -1.2;
          scene.add(grid);

          const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
          camera.position.set(3, 2.8, 3.2);

          scene.add(new THREE.AmbientLight(0xffffff, 0.85));
          const dl1 = new THREE.DirectionalLight(0xffffff, 1.2);
          dl1.position.set(5, 8, 5);
          scene.add(dl1);

          const dl2 = new THREE.DirectionalLight(0x38bdf8, 0.6);
          dl2.position.set(-5, -2, -5);
          scene.add(dl2);

          const geometry = loadGeometryForModel(model);
          const techGroup = createTechnicalRepresentation(geometry);
          scene.add(techGroup);

          const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
          renderer.setSize(w, h);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          container.appendChild(renderer.domElement);

          const controls = new THREE.OrbitControls(camera, renderer.domElement);
          controls.enableDamping = true;
          controls.autoRotate = isRotating;
          controlsRef.current = controls;

          let id;
          const animate = () => {
            id = requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
          };
          animate();

          const handleResize = () => {
            if (!container) return;
            const nw = container.clientWidth;
            const nh = container.clientHeight || 220;
            camera.aspect = nw / nh;
            camera.updateProjectionMatrix();
            renderer.setSize(nw, nh);
          };
          window.addEventListener('resize', handleResize);

          return () => {
            window.removeEventListener('resize', handleResize);
            cancelAnimationFrame(id);
            controls.dispose();
            renderer.dispose();
            if (container.contains(renderer.domElement)) container.removeChild(renderer.domElement);
            geometry.dispose();
          };
        }, [model]);

        useEffect(() => {
          if (controlsRef.current) controlsRef.current.autoRotate = isRotating;
        }, [isRotating]);

        return (
          <div className="relative w-full h-[230px] bg-slate-900 rounded-xl border border-slate-800 overflow-hidden shadow-lg">
            <div className="absolute top-2 left-2 right-2 z-10 flex items-center justify-between pointer-events-none">
              <div className="bg-slate-900/90 backdrop-blur px-2.5 py-1 rounded-lg border border-slate-700/80 text-[11px] font-bold text-cyan-400 pointer-events-auto">
                Axonometrický 3D pohled
              </div>
            </div>
            <div ref={mountRef} className="w-full h-full cursor-grab active:cursor-grabbing" />
            <div className="absolute bottom-2 left-2 right-2 z-10 flex items-center justify-between pointer-events-none">
              <span className="text-[10px] text-slate-400 bg-slate-900/80 px-2 py-0.5 rounded pointer-events-auto">
                💡 Otáčejte myší
              </span>
              <button
                onClick={() => setIsRotating(!isRotating)}
                className="pointer-events-auto px-2 py-0.5 rounded-lg text-[10px] font-medium bg-slate-800 border border-slate-700 text-cyan-400"
              >
                {isRotating ? '⏸ Pozastavit' : '🔄 Rotovat'}
              </button>
            </div>
          </div>
        );
      }

      // 2. Projection Card (Kompaktní h-[230px])
      function ProjectionCard({ model, type, isRevealed, onToggleReveal }) {
        const mountRef = useRef(null);
        const configs = {
          front: { title: 'Nárys', code: 'V1', pos: [0, 0, 5], up: [0, 1, 0], desc: 'Přední pohled (X-Z)' },
          top: { title: 'Půdorys', code: 'V2', pos: [0, 5, 0], up: [0, 0, -1], desc: 'Horní pohled sklopený pod Nárys' },
          side: { title: 'Bokorys', code: 'V3', pos: [5, 0, 0], up: [0, 1, 0], desc: 'Boční pohled zleva vpravo od Nárysu' },
        };
        const cfg = configs[type];

        useEffect(() => {
          if (!isRevealed) return;
          const container = mountRef.current;
          if (!container) return;
          const w = container.clientWidth;
          const h = container.clientHeight || 180;

          const scene = new THREE.Scene();
          scene.background = new THREE.Color(0xffffff);

          const grid = new THREE.GridHelper(5, 10, 0xcbd5e1, 0xf1f5f9);
          if (type !== 'top') grid.rotation.x = Math.PI / 2;
          scene.add(grid);

          const frustum = 3.6;
          const aspect = w / h;
          const camera = new THREE.OrthographicCamera(
            (-frustum * aspect) / 2, (frustum * aspect) / 2,
            frustum / 2, -frustum / 2, 0.1, 100
          );
          camera.position.set(...cfg.pos);
          camera.up.set(...cfg.up);
          camera.lookAt(0, 0, 0);

          scene.add(new THREE.AmbientLight(0xffffff, 0.9));

          const geometry = loadGeometryForModel(model);
          const techGroup = createTechnicalRepresentation(geometry);
          scene.add(techGroup);

          const renderer = new THREE.WebGLRenderer({ antialias: true });
          renderer.setSize(w, h);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          container.appendChild(renderer.domElement);
          renderer.render(scene, camera);

          const handleResize = () => {
            if (!container) return;
            const nw = container.clientWidth;
            const nh = container.clientHeight || 180;
            const na = nw / nh;
            camera.left = (-frustum * na) / 2;
            camera.right = (frustum * na) / 2;
            camera.top = frustum / 2;
            camera.bottom = -frustum / 2;
            camera.updateProjectionMatrix();
            renderer.setSize(nw, nh);
            renderer.render(scene, camera);
          };
          window.addEventListener('resize', handleResize);

          return () => {
            window.removeEventListener('resize', handleResize);
            renderer.dispose();
            if (container.contains(renderer.domElement)) container.removeChild(renderer.domElement);
            geometry.dispose();
          };
        }, [model, type, isRevealed]);

        return (
          <div className="relative bg-white rounded-xl border-2 border-slate-300 shadow-md overflow-hidden flex flex-col h-[230px]">
            <div className="bg-slate-100 px-3 py-1.5 border-b border-slate-200 flex items-center justify-between z-10">
              <div className="flex items-center space-x-1.5">
                <span className="w-2.5 h-2.5 rounded-full bg-cyan-600"></span>
                <span className="font-bold text-slate-800 text-xs">{cfg.title}</span>
                <span className="text-[10px] text-slate-500 font-mono">({cfg.code})</span>
              </div>
              {isRevealed && (
                <button
                  onClick={onToggleReveal}
                  className="text-[11px] font-semibold text-slate-600 hover:text-slate-900 bg-slate-200 px-2 py-0.5 rounded"
                >
                  🙈 Skrýt
                </button>
              )}
            </div>

            <div className="relative flex-1 w-full bg-slate-50 flex items-center justify-center">
              {isRevealed ? (
                <div ref={mountRef} className="w-full h-full" />
              ) : (
                <div className="absolute inset-0 bg-gradient-to-b from-slate-800 to-slate-900 flex flex-col items-center justify-center p-3 text-center z-20">
                  <h3 className="text-white font-bold text-sm mb-1">{cfg.title} je skryt</h3>
                  <p className="text-slate-400 text-[11px] max-w-xs mb-2.5">{cfg.desc}</p>
                  <button
                    onClick={onToggleReveal}
                    className="px-4 py-1.5 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold text-xs shadow hover:brightness-110 active:scale-95 transition-all"
                  >
                    👁️ Odkrýt {cfg.title}
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      }

      // 3. 3D Model Miniature Thumbnail
      function ModelPreviewThumbnail({ model }) {
        const mountRef = useRef(null);
        useEffect(() => {
          const container = mountRef.current;
          if (!container) return;
          const w = container.clientWidth || 120;
          const h = container.clientHeight || 120;

          const scene = new THREE.Scene();
          scene.background = new THREE.Color(0x0f172a);

          const camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
          camera.position.set(3, 2.5, 3.2);
          camera.lookAt(0, 0, 0);

          scene.add(new THREE.AmbientLight(0xffffff, 0.9));
          const dl = new THREE.DirectionalLight(0xffffff, 1.2);
          dl.position.set(5, 8, 5);
          scene.add(dl);

          const geometry = loadGeometryForModel(model);
          const techGroup = createTechnicalRepresentation(geometry);
          scene.add(techGroup);

          const renderer = new THREE.WebGLRenderer({ antialias: true });
          renderer.setSize(w, h);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          container.appendChild(renderer.domElement);
          renderer.render(scene, camera);

          return () => {
            renderer.dispose();
            if (container.contains(renderer.domElement)) container.removeChild(renderer.domElement);
            geometry.dispose();
          };
        }, [model]);

        return (
          <div className="w-24 h-24 sm:w-28 sm:h-28 rounded-xl bg-slate-900 border border-slate-700 overflow-hidden shrink-0 shadow-md">
            <div ref={mountRef} className="w-full h-full" />
          </div>
        );
      }

      // 4. Classroom Presentation View (Fits 1 Screen)
      function ClassroomPresentation({ models }) {
        const [selectedId, setSelectedId] = useState(models[0]?.id || '');
        const [difficultyFilter, setDifficultyFilter] = useState('vse');
        const [reveals, setReveals] = useState({ front: false, top: false, side: false });

        const filteredModels = models.filter(m => difficultyFilter === 'vse' || m.difficulty === difficultyFilter);
        const selectedModel = models.find(m => m.id === selectedId) || models[0];

        const handleSelect = (id) => {
          setSelectedId(id);
          setReveals({ front: false, top: false, side: false });
        };

        const handleRandom = () => {
          if (!filteredModels.length) return;
          const idx = Math.floor(Math.random() * filteredModels.length);
          handleSelect(filteredModels[idx].id);
        };

        if (!selectedModel) return <div className="p-8 text-center text-slate-400">Žádné modely k dispozici.</div>;

        const isAllRevealed = reveals.front && reveals.top && reveals.side;

        return (
          <div className="space-y-3 max-w-7xl mx-auto">
            <div className="bg-slate-900 px-4 py-2.5 rounded-xl border border-slate-800 shadow-md flex flex-wrap items-center justify-between gap-3">
              <div className="flex flex-wrap items-center gap-2">
                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">3D Těleso:</span>
                <select
                  value={selectedModel.id}
                  onChange={(e) => handleSelect(e.target.value)}
                  className="bg-slate-800 text-white font-bold text-xs px-3 py-1.5 rounded-lg border border-slate-700 focus:outline-none cursor-pointer"
                >
                  {filteredModels.map(m => (
                    <option key={m.id} value={m.id}>{m.name} [{m.difficulty.toUpperCase()}]</option>
                  ))}
                </select>

                <div className="flex bg-slate-800 p-0.5 rounded-lg border border-slate-700 ml-2">
                  {['vse', 'lehká', 'střední', 'těžká'].map(diff => (
                    <button
                      key={diff}
                      onClick={() => setDifficultyFilter(diff)}
                      className={`px-2.5 py-1 rounded text-[11px] font-medium ${
                        difficultyFilter === diff ? 'bg-cyan-500 text-slate-950 font-bold' : 'text-slate-300'
                      }`}
                    >
                      {diff === 'vse' ? 'Všechny' : diff.charAt(0).toUpperCase() + diff.slice(1)}
                    </button>
                  ))}
                </div>

                <button
                  onClick={handleRandom}
                  className="px-3 py-1.5 bg-slate-800 border border-slate-700 text-cyan-400 font-semibold text-xs rounded-lg hover:bg-slate-700"
                >
                  🎲 Náhodné
                </button>
              </div>

              <div>
                {!isAllRevealed ? (
                  <button
                    onClick={() => setReveals({ front: true, top: true, side: true })}
                    className="px-4 py-1.5 bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-extrabold text-xs rounded-lg shadow"
                  >
                    👁️ Odkrýt všechny 3 průměty
                  </button>
                ) : (
                  <button
                    onClick={() => setReveals({ front: false, top: false, side: false })}
                    className="px-4 py-1.5 bg-slate-800 text-slate-200 border border-slate-700 font-bold text-xs rounded-lg"
                  >
                    🙈 Skrýt průměty
                  </button>
                )}
              </div>
            </div>

            {/* 2x2 Technical Drawing Layout (Compact Height) */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              <ProjectionCard
                model={selectedModel}
                type="front"
                isRevealed={reveals.front}
                onToggleReveal={() => setReveals(r => ({ ...r, front: !r.front }))}
              />
              <ProjectionCard
                model={selectedModel}
                type="side"
                isRevealed={reveals.side}
                onToggleReveal={() => setReveals(r => ({ ...r, side: !r.side }))}
              />
              <ProjectionCard
                model={selectedModel}
                type="top"
                isRevealed={reveals.top}
                onToggleReveal={() => setReveals(r => ({ ...r, top: !r.top }))}
              />
              <AxonometryViewer model={selectedModel} />
            </div>
          </div>
        );
      }

      // 5. Teacher Model Manager
      function TeacherModelManager({ models, onModelsChanged }) {
        const [isUploading, setIsUploading] = useState(false);
        const [name, setName] = useState('');
        const [difficulty, setDifficulty] = useState('střední');
        const [description, setDescription] = useState('');
        const [fileData, setFileData] = useState(null);
        const [fileName, setFileName] = useState('');

        const handleFile = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          setFileName(file.name);
          setName(file.name.replace(/\.[^/.]+$/, ''));

          const reader = new FileReader();
          reader.readAsText(file);
          reader.onload = (evt) => setFileData(evt.target.result);
        };

        const handleSave = async (e) => {
          e.preventDefault();
          if (!name || !fileData) return alert('Zadejte název a vyberte .OBJ soubor.');
          await saveModelToDB({
            id: 'custom-' + Date.now(),
            name,
            difficulty,
            description: description || 'Vlastní CAD model nahrán učitelem.',
            fileType: 'obj',
            fileData,
            isSample: false,
          });
          setIsUploading(false);
          setName(''); setDescription(''); setFileData(null); setFileName('');
          onModelsChanged();
        };

        return (
          <div className="space-y-6 max-w-6xl mx-auto">
            <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 flex items-center justify-between">
              <div>
                <h2 className="text-xl font-bold text-white">📁 Správa CAD Modelů v Databázi</h2>
                <p className="text-slate-400 text-sm mt-1">Nahrávání OBJ modelů z Fusion 360 s vizuálním 3D náhledem těles.</p>
              </div>
              <button
                onClick={() => setIsUploading(!isUploading)}
                className="px-5 py-2.5 bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold text-sm rounded-xl"
              >
                {isUploading ? 'Zavřít' : '➕ Nahrát nový OBJ model'}
              </button>
            </div>

            {isUploading && (
              <form onSubmit={handleSave} className="bg-slate-900 p-6 rounded-2xl border border-cyan-500/40 space-y-4">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <label className="flex flex-col items-center justify-center h-36 border-2 border-dashed border-slate-700 hover:border-cyan-500 rounded-xl cursor-pointer bg-slate-800/50 p-4 text-center">
                    <span className="text-sm font-semibold text-slate-200">{fileName || 'Vyberte soubor .obj z Fusion 360'}</span>
                    <input type="file" accept=".obj" onChange={handleFile} className="hidden" />
                  </label>
                  <div className="space-y-3">
                    <input
                      type="text" value={name} onChange={(e) => setName(e.target.value)}
                      placeholder="Název tělesa" className="w-full bg-slate-800 px-3.5 py-2 rounded-xl border border-slate-700 text-sm text-white"
                    />
                    <select
                      value={difficulty} onChange={(e) => setDifficulty(e.target.value)}
                      className="w-full bg-slate-800 px-3.5 py-2 rounded-xl border border-slate-700 text-sm font-semibold text-white"
                    >
                      <option value="lehká">Lehká</option>
                      <option value="střední">Střední</option>
                      <option value="těžká">Těžká</option>
                    </select>
                    <textarea
                      value={description} onChange={(e) => setDescription(e.target.value)}
                      placeholder="Popis ke cvičení..." rows={2} className="w-full bg-slate-800 px-3.5 py-2 rounded-xl border border-slate-700 text-sm text-white"
                    />
                  </div>
                </div>
                <button type="submit" className="px-6 py-2 bg-cyan-500 text-slate-950 font-bold rounded-xl text-xs">
                  💾 Uložit do databáze
                </button>
              </form>
            )}

            {/* Catalog Grid with Live 3D Thumbnails */}
            <div className="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
              <div className="px-6 py-4 border-b border-slate-800 flex items-center justify-between">
                <h3 className="font-bold text-white text-base">Katalog 3D těles v databázi ({models.length})</h3>
                <button
                  onClick={async () => { await resetDBToSamples(); onModelsChanged(); }}
                  className="text-xs text-rose-400 font-semibold px-3 py-1 bg-rose-500/10 border border-rose-500/30 rounded-lg"
                >
                  Obnovit 5 ukázkových těles
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 p-4">
                {models.map(m => (
                  <div key={m.id} className="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-4 flex items-start space-x-4">
                    <ModelPreviewThumbnail model={m} />
                    <div className="flex-1 min-w-0 flex flex-col justify-between h-full">
                      <div>
                        <div className="flex items-center space-x-2">
                          <span className="px-2 py-0.5 rounded text-[10px] bg-cyan-500/20 text-cyan-300 font-bold uppercase">{m.difficulty}</span>
                          <span className="text-[10px] text-slate-400 font-mono">{m.fileType.toUpperCase()}</span>
                        </div>
                        <h4 className="font-bold text-white text-sm mt-1 truncate">{m.name}</h4>
                        <p className="text-xs text-slate-400 mt-1 line-clamp-2">{m.description}</p>
                      </div>
                      <div className="mt-2 flex justify-end">
                        {!m.isSample && (
                          <button
                            onClick={async () => { await deleteModelFromDB(m.id); onModelsChanged(); }}
                            className="px-3 py-1 bg-slate-800 text-rose-400 hover:bg-rose-900/40 rounded-lg text-xs font-semibold"
                          >
                            Smazat
                          </button>
                        )}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      // 6. Theory Section
      function TheorySection() {
        return (
          <div className="space-y-6 max-w-5xl mx-auto">
            <div className="bg-slate-900 p-8 rounded-3xl border border-slate-800">
              <h2 className="text-2xl font-extrabold text-white mb-3">📖 Teorie Pravoúhlého Promítání (ČSN EN ISO 128)</h2>
              <p className="text-slate-300 text-sm leading-relaxed">
                Evropské promítání (1. kvadrant / ISO E) rozkládá 3D CAD těleso na tři ortografické průměty: Nárys (V1), Půdorys (V2) a Bokorys (V3).
              </p>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                <h3 className="font-bold text-white text-lg">1. Nárys (V1)</h3>
                <p className="text-slate-400 text-xs mt-2">Pohled zepředu na svislou průmětnu. Udává šířku (X) a výšku (Z).</p>
              </div>
              <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                <h3 className="font-bold text-white text-lg">2. Půdorys (V2)</h3>
                <p className="text-slate-400 text-xs mt-2">Pohled shora sklopený pod Nárys. Udává šířku (X) a hloubku (Y).</p>
              </div>
              <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                <h3 className="font-bold text-white text-lg">3. Bokorys (V3)</h3>
                <p className="text-slate-400 text-xs mt-2">Pohled zleva sklopený vpravo od Nárysu. Udává hloubku (Y) a výšku (Z).</p>
              </div>
            </div>
          </div>
        );
      }

      // --- MAIN APP ---
      function App() {
        const [tab, setTab] = useState('presentation');
        const [models, setModels] = useState([]);
        const [loading, setLoading] = useState(true);

        const load = async () => {
          setLoading(true);
          const data = await getAllModelsFromDB();
          setModels(data);
          setLoading(false);
        };

        useEffect(() => { load(); }, []);

        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
            <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
              <div className="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-extrabold text-slate-950 text-xs">
                    CAD
                  </div>
                  <div>
                    <h1 className="font-bold text-sm text-white">Pravoúhlé Promítání CAD</h1>
                    <p className="text-[10px] text-slate-400">Výukový software pro školy</p>
                  </div>
                </div>

                <nav className="flex space-x-2 bg-slate-800/80 p-1 rounded-xl border border-slate-700">
                  <button
                    onClick={() => setTab('presentation')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${tab === 'presentation' ? 'bg-cyan-500 text-slate-950' : 'text-slate-300'}`}
                  >
                    🏫 Výuka ve třídě
                  </button>
                  <button
                    onClick={() => setTab('teacher')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${tab === 'teacher' ? 'bg-cyan-500 text-slate-950' : 'text-slate-300'}`}
                  >
                    📁 Databáze modelů ({models.length})
                  </button>
                  <button
                    onClick={() => setTab('theory')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${tab === 'theory' ? 'bg-cyan-500 text-slate-950' : 'text-slate-300'}`}
                  >
                    📖 Teorie
                  </button>
                </nav>

                <button
                  onClick={async () => { const res = await resetDBToSamples(); setModels(res); }}
                  className="hidden md:block px-3 py-1 rounded-lg border border-slate-700 text-xs text-slate-300 hover:bg-slate-800"
                >
                  Obnovit ukázky
                </button>
              </div>
            </header>

            <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-4">
              {loading ? (
                <div className="text-center py-20 text-slate-400">Načítání CAD databáze...</div>
              ) : (
                <>
                  {tab === 'presentation' && <ClassroomPresentation models={models} />}
                  {tab === 'teacher' && <TeacherModelManager models={models} onModelsChanged={load} />}
                  {tab === 'theory' && <TheorySection />}
                </>
              )}
            </main>

            <footer className="bg-slate-900 border-t border-slate-800 text-slate-400 text-[11px] py-2 px-4 text-center">
              Pravoúhlé Promítání CAD • Podpora OBJ souborů z programu Fusion 360 • ČSN EN ISO 128
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
